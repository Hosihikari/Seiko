# A shareable declaration for a hosting shim plus its bundle marker.
# The marker makes the shim prefer the bundle artifact whose prerequisite
# names it; the marker's own dependency keeps both root-reachable.
schemaVersion = 2

sources = [
  { id = "official", index = "https://raw.githubusercontent.com/Hosihikari/SeiIndex/main/index.json" }
]

# Pin the platform explicitly so a shared lock stays meaningful.
rid = "win-x64"

sei = [
  { name = "hosihikari-hosting", version = "[1.2.1]" },
  { name = "hosihikari-hosting-levilamina", version = "[1.0.0]" }
]
