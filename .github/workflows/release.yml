name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (v0.2.3 or newer)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must look like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          git rev-parse "refs/tags/$tag" >/dev/null
          if ! git cat-file -e "refs/tags/$tag:.github/scripts/smoke.sh" 2>/dev/null; then
            echo "::error::cannot rebuild tag $tag: it predates the current build workflow (v0.2.3 or newer is required)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Seiko.slnx
      - name: Test
        run: dotnet test tests/Seiko.Tests/Seiko.Tests.csproj -c Release --no-restore

  build:
    name: Build
    needs: [validate, test]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify required release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-arm64; do
            case "$rid" in
              win-*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            asset="sk-$version-$rid.$ext"
            if [ ! -f "dist/$asset" ]; then
              echo "::error::missing required release asset: $asset"
              exit 1
            fi
          done
          for rid in win-x86 linux-arm osx-x64; do
            case "$rid" in
              win-*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            asset="sk-$version-$rid.$ext"
            if [ ! -f "dist/$asset" ]; then
              echo "::warning::optional release asset missing: $asset"
            fi
          done

      - name: Add installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 dist/
          python3 - dist <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = []
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name != "SHA256SUMS":
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Seiko ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: dist/*
