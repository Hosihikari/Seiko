name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Seiko.slnx
      - name: Build
        run: dotnet build Seiko.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Seiko.Tests/Seiko.Tests.csproj -c Release --no-build

  aot:
    name: NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Ensure vswhere on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) {
            $installer | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Publish
        run: dotnet publish src/CommandLine/Seiko.CommandLine.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:StripSymbols=true
      - uses: actions/upload-artifact@v7
        with:
          name: sk-cli-${{ matrix.rid }}
          path: src/CommandLine/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
