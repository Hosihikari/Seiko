name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Seiko.slnx
      - name: Build
        run: dotnet build Seiko.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Seiko.Tests/Seiko.Tests.csproj -c Release --no-build
      - name: Installer architecture detection
        run: bash tests/installer-detect.sh

  aot:
    name: NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Ensure vswhere on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) {
            $installer | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Publish
        run: dotnet publish src/CommandLine/Seiko.CommandLine.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:StripSymbols=true
      - name: Publish MCP server
        run: dotnet publish src/McpServer/Seiko.McpServer.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:StripSymbols=true
      - name: Smoke test MCP server
        shell: bash
        run: |
          set -euo pipefail
          bin="src/McpServer/bin/Release/net10.0/${{ matrix.rid }}/publish/seiko-mcp"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          "$bin" --version
          "$bin" --help >/dev/null
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$bin" --allow-mutations)
          printf '%s\n' "$out" | grep -q '"name":"seiko-mcp"'
          printf '%s\n' "$out" | grep -q '"rollback"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sk-cli-${{ matrix.rid }}
          path: src/CommandLine/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seiko-mcp-${{ matrix.rid }}
          path: src/McpServer/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
